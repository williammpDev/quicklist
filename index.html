<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Quick List</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="logo">
        <img src="icons/logo.svg" alt="" />
        <h1>quicklist</h1>
      </div>

      <a href="index.html" class="text-link back-button"> ← Voltar </a>

      <h2 class="text-title">Compras da semana</h2>

      <form class="add-item">
        <input id="new-item" type="text" placeholder="Adicione um novo item" />
        <button class="text-label" type="submit">Adicionar item</button>
      </form>

      <ul class="list">
        <li>
          <label>
            <input type="checkbox" />
            <span class="text-paragraph">Pão de forma</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
        <li>
          <label>
            <input type="checkbox" />
            <span class="text-paragraph">Café melita</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
        <li>
          <label>
            <input type="checkbox" />
            <span class="text-paragraph">Suco de Laranja</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
        <li>
          <label>
            <input type="checkbox" />
            <span class="text-paragraph">Bolacha</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
      </ul>

      <div class="alert">
        <img src="icons/alert_white.svg" alt="" />
        <p class="text-paragraph">O item foi removido da lista</p>
        <button aria-label="Fechar aviso">
          <img src="icons/close_white.svg" alt="" />
        </button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
