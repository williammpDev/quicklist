<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>Quick List</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="logo">
      <img src="icons/Larkef x Rareblocks _ Logo #38 1.svg" alt="logo" />
      <h1>quicklist</h1>
    </div>

    <a href="index.html">Voltar </a>

    <h2>Compras da semana</h2>

    <div class="addItem">
      <input type="text" placeholder="Adicionar um novo item" />
      <button>Adicionar item</button>
    </div>

    <div class="list">
      <ul>
        <li>
          <span>Pão de forma</span>
          <button>Remover</button>
        </li>
        <li>
          <span>Café melita</span>
          <button>Remover</button>
        </li>
        <li>
          <span>Suco de Laranja</span>
          <button>Remover</button>
        </li>
        <li>
          <span>Bolacha</span>
          <button>Remover</button>
        </li>
      </ul>
    </div>

    <div class="removeItem">
      <p>O item foi removido da lista</p>
    </div>
  </body>
</html>
