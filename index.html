<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Quick List</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="logo">
        <img src="icons/logo.svg" alt="logo" />
        <h1>quicklist</h1>
      </div>

      <a href="index.html">Voltar </a>

      <h2>Compras da semana</h2>

      <form class="add-item">
        <input type="text" placeholder="Adicionar um novo item" />
        <button>Adicionar item</button>
      </form>

      <ul class="list">
        <li>
          <label>
            <input type="checkbox" />
            <span>Pão de forma</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
        <li>
          <label>
            <input type="checkbox" />
            <span>Café melita</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
        <li>
          <label>
            <input type="checkbox" />
            <span>Suco de Laranja</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
        <li>
          <label>
            <input type="checkbox" />
            <span>Bolacha</span>
          </label>
          <button aria-label="Remover item">
            <img src="icons/trash.png" alt="" />
          </button>
        </li>
      </ul>

      <div class="removeItem">
        <p>
          O item foi removido da lista
          <img src="icons/close.png" alt="" />
        </p>
      </div>
    </main>
  </body>
</html>
